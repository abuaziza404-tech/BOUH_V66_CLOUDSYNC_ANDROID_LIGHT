name: BOUH V66 Minimal APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project
        shell: bash
        run: |
          set -eux

          mkdir -p app/src/main/java/com/bouh/v66
          mkdir -p app/src/main/res/values

          printf '%s\n' \
          "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" \
          "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" \
          "rootProject.name='BOUH_V66'" \
          "include ':app'" > settings.gradle

          printf '%s\n' \
          "plugins { id 'com.android.application' version '8.6.1' apply false }" > build.gradle

          printf '%s\n' \
          "plugins { id 'com.android.application' }" \
          "" \
          "android { namespace 'com.bouh.v66'; compileSdk 35" \
          "defaultConfig { applicationId 'com.bouh.v66'; minSdk 23; targetSdk 35; versionCode 66; versionName '66.0' } }" \
          > app/build.gradle

          printf '%s\n' \
          '<resources>' \
          '  <string name="app_name">BOUH V66</string>' \
          '  <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />' \
          '</resources>' > app/src/main/res/values/values.xml

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '  <application android:label="@string/app_name" android:theme="@style/AppTheme" android:supportsRtl="true">' \
          '    <activity android:name=".MainActivity" android:exported="true">' \
          '      <intent-filter>' \
          '        <action android:name="android.intent.action.MAIN" />' \
          '        <category android:name="android.intent.category.LAUNCHER" />' \
          '      </intent-filter>' \
          '    </activity>' \
          '  </application>' \
          '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
          'package com.bouh.v66;' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.widget.TextView;' \
          'public class MainActivity extends Activity {' \
          '  public void onCreate(Bundle b) {' \
          '    super.onCreate(b);' \
          '    TextView v = new TextView(this);' \
          '    v.setText("BOUH V66 APK BUILD SUCCESS");' \
          '    v.setTextSize(24);' \
          '    v.setPadding(40,80,40,40);' \
          '    setContentView(v);' \
          '  }' \
          '}' > app/src/main/java/com/bouh/v66/MainActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -eux
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d $HOME
          $HOME/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-V66-debug-apk
          path: app/build/outputs/apk/debug/*.apk
