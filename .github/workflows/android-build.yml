name: BOUH V66 Direct APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK without Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create direct Android source
        shell: bash
        run: |
          set -e

          mkdir -p src/com/bouh/v66
          mkdir -p res/values
          mkdir -p build/classes
          mkdir -p build/dex
          mkdir -p output

          cat > AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.bouh.v66">

    <uses-sdk
        android:minSdkVersion="23"
        android:targetSdkVersion="35" />

    <application
        android:label="@string/app_name"
        android:theme="@android:style/Theme.Material.Light.NoActionBar"
        android:allowBackup="true"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>
    </application>
</manifest>
EOF

          cat > res/values/strings.xml <<'EOF'
<resources>
    <string name="app_name">BOUH V66</string>
</resources>
EOF

          cat > src/com/bouh/v66/MainActivity.java <<'EOF'
package com.bouh.v66;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.view.Gravity;
import android.widget.LinearLayout;
import android.widget.TextView;
import android.widget.ScrollView;

public class MainActivity extends Activity {

    private TextView label(String text, float size, int color) {
        TextView v = new TextView(this);
        v.setText(text);
        v.setTextSize(size);
        v.setTextColor(color);
        v.setGravity(Gravity.CENTER);
        v.setPadding(8, 14, 8, 14);
        return v;
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setGravity(Gravity.CENTER_HORIZONTAL);
        root.setPadding(28, 60, 28, 28);
        root.setBackgroundColor(Color.rgb(7, 17, 13));

        root.addView(label("BOUH V66", 32, Color.rgb(215, 179, 90)));
        root.addView(label("CLOUDSYNC ANDROID LIGHT", 18, Color.WHITE));
        root.addView(label("DIRECT APK BUILD", 18, Color.rgb(120, 255, 170)));
        root.addView(label("NO GRADLE - NO KOTLIN", 16, Color.WHITE));
        root.addView(label("Ahmed Abu Aziza Al-Rashidi", 16, Color.rgb(215, 179, 90)));

        ScrollView scroll = new ScrollView(this);
        scroll.addView(root);
        setContentView(scroll);
    }
}
EOF

      - name: Build APK directly
        shell: bash
        run: |
          set -e

          export BT="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Build tools=$BT"
          echo "Android jar=$ANDROID_JAR"

          javac -source 8 -target 8 \
            -classpath "$ANDROID_JAR" \
            -d build/classes \
            $(find src -name "*.java")

          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --output build/dex \
            $(find build/classes -name "*.class")

          "$BT/aapt2" compile \
            --dir res \
            -o build/resources.zip

          "$BT/aapt2" link \
            -o build/unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            -R build/resources.zip \
            --min-sdk-version 23 \
            --target-sdk-version 35 \
            --version-code 66 \
            --version-name "66.0-direct" \
            --auto-add-overlay

          cd build/dex
          zip -q -r ../unsigned.apk classes.dex
          cd ../..

          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair \
            -v \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=BOUH,C=SD"

          "$BT/apksigner" sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/BOUH-V66-DIRECT-debug.apk \
            build/aligned.apk

          "$BT/apksigner" verify output/BOUH-V66-DIRECT-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-V66-DIRECT-debug-apk
          path: output/BOUH-V66-DIRECT-debug.apk
          if-no-files-found: error
