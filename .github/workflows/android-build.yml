name: BOUH V66 Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build BOUH V66 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare BOUH Android source
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/bouh/terrainradar
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BOUH_V66_CLOUDSYNC_ANDROID_LIGHT"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bouh.terrainradar"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.bouh.terrainradar"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 66
                  versionName = "66.0-light"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="BOUH V66" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07110D</item>
                  <item name="android:navigationBarColor">#07110D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/bouh/terrainradar/MainActivity.kt <<'EOF'
          package com.bouh.terrainradar
          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.ScrollView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(28, 42, 28, 28)
                      setBackgroundColor(Color.rgb(7, 17, 13))
                  }
                  fun label(text: String, size: Float, color: Int = Color.WHITE) = TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(color)
                      gravity = Gravity.CENTER
                      setPadding(6, 10, 6, 10)
                  }
                  root.addView(label("BOUH V66", 28f, Color.rgb(215, 179, 90)))
                  root.addView(label("CLOUDSYNC ANDROID LIGHT", 17f))
                  root.addView(label("APK Build Enabled", 16f, Color.rgb(120, 255, 170)))
                  root.addView(label("Ahmed Abu Aziza Al-Rashidi", 15f, Color.rgb(215, 179, 90)))
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
          EOF

      - name: Download Gradle
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        shell: bash
        run: |
          /tmp/gradle-8.9/bin/gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOUH-V66-LIGHT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
